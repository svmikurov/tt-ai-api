[project]
name = "tt-ai-api"
version = "0.3.0"
description = """
A backend for interacting with an ML model. The model's API is already configured
and ready (it works synchronously, one question = one answer, the rest are discarded).
We need to enable several hundred users in real time. The design and frontend are provided.
"""
authors = [
    {name = "Sergei Mikurov", email = "454004@mail.ru"}
]
readme = "README.rst"
requires-python = ">=3.13,<4"

[tool.poetry]
packages = [
    {include = "sd", from = "src"}
]

[tool.poetry.dependencies]
dependency-injector = "^4.49.1"
pydantic = "^2.13.4"
redis = "^8.1.0"

[dependency-groups]
entrypoints = [
    "fastapi (>=0.141.1,<0.142.0)",
    "sse-starlette (>=3.4.8,<4.0.0)"
]
docs = [
    "sphinx (>=9.1.0,<10.0.0)"
]
development = [
    "ruff (>=0.16.3,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "httpx2 (>=2.10.0,<3.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
