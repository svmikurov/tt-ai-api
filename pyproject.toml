[project]
name = "sd"
version = "0.1.0"
description = ""
authors = [
    {name = "Sergei Mikurov",email = "454004@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13"

[tool.poetry]
packages = [{include = "sd", from = "src"}]

[tool.poetry.dependencies]
celery = "^5.6.3"
sqlalchemy = "^2.0.52"
redis = "^8.1.0"
dependency-injector = "^4.49.1"

[dependency-groups]
entrypoint = [
    "fastapi (>=0.141.1,<0.142.0)"
]
docs = [
    "sphinx (>=9.1.0,<10.0.0)"
]
infrastructure = [
    "uvicorn[standard] (>=0.52.3,<0.53.0)"
]
development = [
    "ruff (>=0.16.3,<0.17.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
